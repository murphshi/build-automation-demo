name: CI Build and Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Package artifact
        run: |
          mkdir -p dist
          zip -r "dist/app-${VERSION}.zip" app.py requirements.txt test_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.VERSION }}
          path: dist/app-${{ env.VERSION }}.zip
